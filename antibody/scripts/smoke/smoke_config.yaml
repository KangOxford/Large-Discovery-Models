acq: ei
ard: true
batch_size: 1
device: cpu
kernel_type: transformed_overlap
max_iters: 3
min_cuda: 1000
n_init: 5
noise_variance: 1e-6
normalise: true
resume: false
save_path: /tmp/antbo_smoke_outputs
search_strategy: local
seq_len: 11
tabular_search_csv: null

# All LDM flags disabled — smoke must run without any LDM dependency.
llm_ranked_init: false
llm_trust_region: false
llm_antigen_context: false
llm_init_policy_path: null
llm_trust_region_policy_path: null

bbox:
  antigen: SMOKE_1ADQ_A
  tool: random
  path: /tmp
  process: 1
  startTask: 0