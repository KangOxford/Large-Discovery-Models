[project]
name = "ldm-tts-antibody"
version = "0.1.0"
description = "Antibody task workflow for the shared LDM-TTS runner."
requires-python = ">=3.10,<3.13"
dependencies = [
    "botorch>=0.10",
    "gpytorch>=1.11",
    "numpy>=1.26",
    "openai>=1.99.0",
    "pandas>=2.0",
    "pymoo>=0.6.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "torch>=2.3",
    "tqdm>=4.62",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv]
package = false
