### model
model_name_or_path: Qwen/Qwen3.5-9B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: LLaMA-Factory/examples/deepspeed/ds_z3_offload_config.json

### dataset
dataset: ldm_rationale_train
eval_dataset: ldm_rationale_eval
dataset_dir: ../data/generated/full_sft
template: qwen3_5_nothink
enable_thinking: false
cutoff_len: 16384
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: ../data/generated/full_sft/checkpoints/qwen3_5_9b_full_sft_rationale
logging_steps: 5
save_strategy: epoch
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
report_to: none                # set to wandb and add run_name to enable logging

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: sdpa
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: epoch
