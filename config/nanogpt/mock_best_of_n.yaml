name: nanogpt_mock_best_of_n
task: nanogpt
algorithm: best_of_n
mode: mock
description: Safe nanoGPT LDM-TTS smoke run using the operation mock generator.
args:
  train-file: resources/train/mock_train.py
  operation-schema: resources/schemas/mock_operations.json
  generator: operation_mock
  method: best_of_n
  breadth: 2
  depth: 1
  iterations: 2
  warmup: 1
  seed-policy: best
  initial-operation-features: 5
  max-active-operation-features: 0
  disable-feature-expansion: false
  allow-new-feature-specs: false
  mock-expand-every: 0
  surrogate-mode: lcb
  gp-beta: 1.0
  gp-xi: 0.001
  out-dir: runs
  run-name: "{name}"
  eval-command: "python {train_path}"
