name: nanogpt_real_operation_tool_best_of_n
task: nanogpt
algorithm: best_of_n
mode: real
description: nanoGPT operation-tool LDM-TTS run against an OpenAI-compatible endpoint.
env:
  TTS_LLM_URL: http://127.0.0.1:52312/v1
  TTS_LLM_MODEL: Qwen3-Coder-30B-A3B-Instruct
  TTS_LLM_API_KEY: EMPTY
args:
  train-file: ldm_task/real_train.py
  operation-schema: ldm_task/operation_schema_real_train.json
  generator: operation_tool
  method: best_of_n
  breadth: 1
  depth: 1
  iterations: 100
  warmup: 20
  seed-policy: best
  buffer: ldm_runs/ablation_buffer/expanded_exp1/gp_warmup.jsonl
  initial-operation-features: 5
  max-active-operation-features: 0
  disable-feature-expansion: false
  allow-new-feature-specs: false
  out-dir: ldm_runs
  run-name: "{name}"
  eval-command: "uv run --project {repo_root}/nanogpt python {train_path}"
  llm-url: ${TTS_LLM_URL}
  llm-model-name: ${TTS_LLM_MODEL}
  api-key: ${TTS_LLM_API_KEY}
  temperature: 0.7
