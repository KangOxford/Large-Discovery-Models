name: nanogpt_real_operation_tool_best_of_n
task: nanogpt
algorithm: best_of_n
mode: real
description: nanoGPT operation-tool LDM-TTS run against an OpenAI-compatible endpoint.
args:
  train-file: ldm_task/real_train.py
  operation-schema: ldm_task/operation_schema_real_train.json
  generator: operation_tool
  method: best_of_n
  breadth: 4
  depth: 4
  iterations: 100
  warmup: 20
  seed-policy: best
  buffer: ldm_runs/ablation_buffer/expanded_exp1/gp_warmup.jsonl
  out-dir: ldm_runs
  run-name: "{name}"
  eval-command: "uv run python {train_path}"
  llm-url: http://127.0.0.1:52307/v1
  llm-model-name: Qwen3-Coder-30B-A3B-Instruct
  temperature: 0.7
