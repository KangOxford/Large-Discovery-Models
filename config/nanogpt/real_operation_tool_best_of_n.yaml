name: nanogpt_real_operation_tool_best_of_n
task: nanogpt
algorithm: best_of_n
mode: real
description: nanoGPT operation-tool LDM-TTS run against an OpenAI-compatible endpoint.
args:
  train-file: resources/train/real_train.py
  operation-schema: resources/schemas/real_operations.json
  generator: operation_tool
  method: best_of_n
  breadth: 1
  depth: 1
  iterations: 100
  warmup: 20
  seed-policy: best
  buffer: runs/ablation_buffer/expanded_exp1/gp_warmup.jsonl
  initial-expansion-parameters: 5
  max-expansion-parameters: 0
  disable-expansion-schema-updates: false
  allow-new-expansion-parameters: false
  surrogate-mode: lcb
  gp-beta: 1.0
  gp-xi: 0.001
  out-dir: runs
  run-name: "{name}"
  eval-command: "uv run --locked --group train --project {repo_root}/tasks/nanogpt python {train_path}"
  llm-url: null
  llm-model-name: null
  api-key: null
  temperature: 0.7
