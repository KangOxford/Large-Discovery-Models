name: antibody_paper_direct_softmax
task: antibody
algorithm: ei
mode: real
description: Paper Direct_Softmax antibody experiment over five antigens and five seeds.
args:
  config: resources/default_config.yaml
  antigens-file: resources/antigens.txt
  method: direct_softmax
  seed: 42
  n-trials: 5
  budget: 200
  batch-size: 1
  n-init: 20
  gen-m: 5
  softmax-eta: 1.0
  parallel-budget: 600
  device: cuda
  acq: ei
  acq-xi: 0.001
  llm-temperature: 0.7
  timeout-s: 120
  max-retries: 3
  history-top-k: 20
  include-antigen-context: true
  fallback-random: true
  out-dir: runs/paper/direct_softmax
