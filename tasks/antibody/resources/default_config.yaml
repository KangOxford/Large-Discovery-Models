acq: ei
ard: true
batch_size: 1
device: cuda
kernel_type: transformed_overlap
max_iters: 200
min_cuda: 10
n_init: 20
noise_variance: 1e-6
normalise: true
resume: false
search_strategy: local
seq_len: 11
tabular_search_csv: null

# save_path and antigens_file are CLI-only args now (use --save-path /
# --antigens_file). They are still read from YAML as a fallback for backward
# compat with old configs, but intentionally absent from this default config
# to force explicit per-invocation specification.

# LDM orchestrator (Phase 10 redesign). Reads LLM_API_KEY / LLM_BASE_URL
# from .env via python-dotenv at OpenAIClient construction.
# llm_ranked_init / llm_trust_region / llm_policy_command were removed in
# the redesign; the orchestrator now drives DSL updates directly.
llm:
  llm_init_enabled: false
  llm_loop_enabled: true
  llm_temperature: 0.25
  max_retries: 3
  llm_call_timeout_s: 30
  # DEPRECATED: decision log is now per-(antigen, seed), co-located at
  # {antigen_dir}/llm_decisions.json. This key is accepted but ignored.
  # llm_decisions_log: runs/llm_decisions/exp.json
  history_max_in_prompt: 200
  bias_weight: 0.05
  acq_n_candidates: 10000
  sample_timeout_s: 5.0
  init_pool_size: 100000
  max_nesting_depth: 8
  acq_search_budget: 5000
  acq_max_rounds: 3
  num_llm_review: 10
  strategy: ldm-default

# Antigen feature injection into LLM prompt context (still supported).
llm_antigen_context: true
llm_antigen_context_timeout_s: 30
llm_antigen_context_include_raw: false
llm_prompt_save_every: 0
llm_prompt_top_k: 10

# Legacy llm_ranked_init / llm_policy_command / llm_init_policy_path are
# accepted but ignored (kept for backward compatibility with old configs).

bbox:
  # Placeholder only. core/main.py overwrites this for each antigen from --antigens_file.
  antigen: PLACEHOLDER
  tool: Absolut
  # External dependency: set ABSOLUT_PATH or pass --absolut-path for real runs.
  path: null
  process: 2
  startTask: 0
