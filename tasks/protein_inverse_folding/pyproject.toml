[project]
name = "ldm-tts-protein-inverse-folding"
version = "0.1.0"
description = "Optimize GNN structure encoders for protein inverse folding on CATH and TS50."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7,<8",
]
real = [
    "torch>=2.2",
]

[tool.uv]
package = false
