[project]
name = "ldm-tts-small-molecule"
version = "0.1.0"
description = "Small-molecule task workflow for the shared LDM-TTS runner."
requires-python = ">=3.11,<3.13"
dependencies = [
    "gauche>=0.1.6",
    "gemmi>=0.7.0",
    "gpytorch>=1.15",
    "joblib>=1.0",
    "lightgbm>=3.3",
    "matplotlib>=3.8",
    "meeko>=0.7.1",
    "numpy>=1.26",
    "omegaconf>=2.3.0",
    "openai>=1.99.0",
    "pandas>=2.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rdkit>=2025.9.2,<2026",
    "scikit-learn>=1.0",
    "scipy>=1.13.0",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=4.0",
]

[tool.uv]
package = false
