# LlamaFactory LoRA SFT config for the LDM proposal-distillation dataset.
# Run:  llamafactory-cli train train/ldm_lora_sft.yaml
#
# IMPORTANT: cutoff_len must be large. nanogpt instructions embed the full parent
# train.py (~26KB, often >10k tokens). If truncated, the trailing "## Your move"
# contract is cut off and the model never learns the output format.
# Check your longest sample before training:
#   python -c "import json;print(max(len(json.loads(l)['instruction']) for l in open('data/ldm_sft.jsonl')))"

### model
model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct   # <-- replace with your base model
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

### dataset
# `ldm_bo_sft` is the REGISTERED NAME from dataset_info.json, not a filename.
# To mix tiers/tasks:  dataset: ldm_bo_sft,ldm_sft_nanogpt_gen
dataset: ldm_bo_sft
dataset_dir: ./data
template: qwen                # <-- must match your base model's chat template
cutoff_len: 16384             # see note above; 8192 is the floor
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: ./saves/ldm_proposer_lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
flash_attn: auto

### eval (optional; requires a held-out split)
# IMPORTANT: do NOT evaluate on the same run/seed you trained on -- that is
# circular. Hold out entire run directories or seeds.
# val_size: 0.05
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 200
